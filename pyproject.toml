[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rmfsr-reproduction"
version = "0.1.0"
description = "Independent full-width RMFSR reproduction attempt with explicit paper deviations"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0", "numpy>=1.26,<3", "scipy>=1.11", "soundfile>=0.12", "matplotlib>=3.8", "pystoi>=0.4", "imageio-ffmpeg==0.6.0"]
[tool.setuptools.packages.find]
include = ["rmfsr*"]
